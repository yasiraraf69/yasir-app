<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../static/forgot_password.css">
    <link rel="stylesheet" href="../static/toast.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your registered email or phone, then a new password.</p>

            <form action="/forgot_password" method="POST" id="resetForm">
                <div class="input-group">
                    <input type="text" name="email_phone" placeholder="Enter your Email or Phone" required>
                </div>

                <div class="input-group">
                    <input type="password" name="new_password" id="newPasswordInput" placeholder="Enter your New Password" required>
                </div>

                <button type="submit" class="btn-primary">Reset Password</button>
            </form>

            <div class="auth-links">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Local toast container -->
    <div class="toast-container" id="localToasts"></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="toast-container">
            {% for category, message in messages %}
                <div class="toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <script>
        /* Client-side password length validation */
        const form = document.getElementById('resetForm');
        const newPassword = document.getElementById('newPasswordInput');
        const localToasts = document.getElementById('localToasts');

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast toast-error';
            toast.textContent = message;
            localToasts.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        form.addEventListener('submit', (e) => {
            if (newPassword.value.length < 4) {
                e.preventDefault();
                showToast('Password must be at least 4 characters.');
                newPassword.focus();
                return;
            }
            if (newPassword.value.length > 18) {
                e.preventDefault();
                showToast('Password must be 18 characters or less.');
                newPassword.focus();
                return;
            }
        });

        /* Auto-hide server-side toasts */
        setTimeout(() => {
            document.querySelectorAll('.toast-container:not(#localToasts) .toast').forEach(t => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-100%)';
                setTimeout(() => t.remove(), 300);
            });
        }, 3000);
    </script>

</body>
</html>
