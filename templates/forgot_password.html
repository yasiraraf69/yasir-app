<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../static/forgot_password.css">
    <link rel="stylesheet" href="../static/toast.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your registered email or phone, then a new password.</p>

            <form action="/forgot_password" method="POST">
                <div class="input-group">
                    <input type="text" name="email_phone" placeholder="Enter your Email or Phone" required>
                </div>

                <div class="input-group">
                    <input type="password" name="new_password" placeholder="Enter your New Password" required>
                </div>

                <button type="submit" class="btn-primary">Reset Password</button>
            </form>

            <div class="auth-links">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="toast-container">
            {% for category, message in messages %}
                <div class="toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <script>
        setTimeout(() => {
            document.querySelectorAll('.toast').forEach(t => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(100%)';
                setTimeout(() => t.remove(), 300);
            });
        }, 3000);
    </script>

</body>
</html>
