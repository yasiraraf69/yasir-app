<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="../static/signup.css">
    <link rel="stylesheet" href="../static/toast.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <h2>Create Account</h2>

            <form action="/signup" method="POST" id="signupForm">
                <div class="input-group">
                    <input type="text" name="email_phone" placeholder="Enter your Email or Phone" required>
                </div>

                <div class="input-group">
                    <input type="password" name="password" id="passwordInput" placeholder="Create a Password" required>
                </div>

                <div class="input-group">
                    <input type="password" name="re_password" id="rePasswordInput" placeholder="Re-enter your Password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" name="terms_agree" id="terms" required>
                    <label for="terms">
                        I agree to the
                        <a href="/terms" class="terms-link" onclick="event.stopPropagation();">Terms and Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="auth-links">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="localToasts"></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="toast-container">
            {% for category, message in messages %}
                <div class="toast toast-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <script>
        const form = document.getElementById('signupForm');
        const password = document.getElementById('passwordInput');
        const rePassword = document.getElementById('rePasswordInput');
        const localToasts = document.getElementById('localToasts');

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast toast-error';
            toast.textContent = message;
            localToasts.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        form.addEventListener('submit', (e) => {
            if (password.value.length < 4) {
                e.preventDefault();
                showToast('Password must be at least 4 characters.');
                password.focus();
                return;
            }
            if (password.value.length > 18) {
                e.preventDefault();
                showToast('Password must be 18 characters or less.');
                password.focus();
                return;
            }
            if (password.value !== rePassword.value) {
                e.preventDefault();
                showToast('Passwords do not match!');
                rePassword.focus();
                return;
            }
        });

        setTimeout(() => {
            document.querySelectorAll('.toast-container:not(#localToasts) .toast').forEach(t => {
                t.style.opacity = '0';
                t.style.transform = 'translateX(-100%)';
                setTimeout(() => t.remove(), 300);
            });
        }, 3000);
    </script>

</body>
</html>
